apiVersion: apps/v1
kind: Deployment
metadata:
  name: intern-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intern-app
  template:
    metadata:
      labels:
        app: intern-app
    spec:
      containers:
        - name: react-app
          image: yahyafayad/react-app:latest
          ports:
            - containerPort: 80
